<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Admin · Kuis El-Kisai</title>
  <meta name="theme-color" content="#22215F" />
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <img src="/assets/logo.png" alt="El-Kisai Education" class="brand" />
      <a class="btn-ghost" href="/">Ke Kuis</a>
    </header>

    <!-- Login -->
    <section class="card" id="login">
      <h2>Masuk Admin</h2>
      <form id="form-login">
        <label class="field">
          <span>Password admin</span>
          <input type="password" id="admin-pass" required autocomplete="current-password" />
        </label>
        <p class="error" id="login-error" role="alert"></p>
        <button class="btn-primary btn-block" type="submit">Masuk</button>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" hidden>
      <div class="admin-grid">
        <div class="card wide">
          <div class="section-head">
            <h2 id="form-title">Tambah Soal</h2>
          </div>
          <form id="form-question" class="form-grid">
            <label class="field">
              <span>Kategori</span>
              <input id="f-category" maxlength="40" value="Umum" />
            </label>
            <label class="field full">
              <span>Pertanyaan</span>
              <textarea id="f-question" rows="3" maxlength="500" required></textarea>
            </label>
            <div class="field full">
              <span>Pilihan jawaban (isi minimal 2)</span>
              <div class="opt-inputs">
                <div class="opt-row"><b>A</b><input id="f-opt-0" maxlength="200" /></div>
                <div class="opt-row"><b>B</b><input id="f-opt-1" maxlength="200" /></div>
                <div class="opt-row"><b>C</b><input id="f-opt-2" maxlength="200" /></div>
                <div class="opt-row"><b>D</b><input id="f-opt-3" maxlength="200" /></div>
              </div>
            </div>
            <label class="field">
              <span>Jawaban benar</span>
              <select id="f-correct">
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
              </select>
            </label>
            <label class="field">
              <span>Poin</span>
              <input type="number" id="f-points" min="1" max="100" value="10" />
            </label>
            <label class="field">
              <span>Waktu (detik)</span>
              <input type="number" id="f-time" min="5" max="300" value="40" />
            </label>
            <label class="field">
              <span>Urutan</span>
              <input type="number" id="f-position" min="0" value="0" />
            </label>
            <label class="check">
              <input type="checkbox" id="f-active" checked /> Aktif
            </label>
            <p class="error full" id="form-error" role="alert"></p>
            <div class="actions full">
              <button class="btn-primary" type="submit" id="f-submit">Simpan Soal</button>
              <button class="btn-ghost" type="button" id="f-cancel" hidden>Batal</button>
            </div>
          </form>
        </div>

        <div class="card wide">
          <div class="section-head">
            <h2>Daftar Soal</h2>
            <span class="muted small" id="count"></span>
          </div>
          <div id="question-list"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="/js/admin.js" defer></script>
</body>
</html>
